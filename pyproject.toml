[project]
name = "fixtures"
version = "0.1.0"
description = "Middlesex League fixture schedule generator"
requires-python = ">=3.14"
dependencies = [
    "ortools",
    "pyyaml",
]

[dependency-groups]
dev = [
    "hypothesis",
    "ruff",
    "mypy",
    "types-pyyaml",
    "jsonschema",
    "types-jsonschema",
    "json-schema-for-humans",
]

[tool.uv]
package = false

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "A", "C90", "S", "T20", "PT"]
ignore = ["C901"]  # Allow complex functions for algorithms and comprehensive tests

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/text blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["fmodel", "genfixtures"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "PT"]  # Allow assert statements and unittest-style assertions in test files
"genfixtures.py" = ["T201"]  # Allow print statements in fixtures generator
"solve.py" = ["T201"]  # Allow print statements in solve CLI
"report.py" = ["T201"]  # Allow print statements in report CLI
"build_site.py" = ["T201"]  # Allow print statements in site-assembly CLI
"build_schema_docs.py" = ["T201"]  # Allow print statements in schema-docs CLI

[tool.mypy]
# Basic configuration
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

# Moderate strictness - good balance for existing code
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Error output
show_error_codes = true
show_column_numbers = true
pretty = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# No type stubs published for this package
[[tool.mypy.overrides]]
module = ["json_schema_for_humans.*"]
ignore_missing_imports = true

[tool.pytest]
# If pytest is installed, configure test discovery
testpaths = ["."]
python_files = ["*test*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Note: This project uses unittest, but pytest config is included
# for future compatibility. To use unittest, run: python all_tests.py
