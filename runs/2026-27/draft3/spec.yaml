    # three teams list those two as available, and once Kings Head's
    # availability below is applied the spec does not solve without them. Like
    # Metropolitan's June dates they are past the preferred 14th May finish but
    # inside the League Secretary's approved window (to 30th June - see the
    # top-of-file note). Kings Head's three teams draw on overlapping squads and
    # gave DIFFERENT availability, so the per-team 'teams:' section below
    # narrows the club list for each:
    #
    #   - unavailable_home_dates subtracts, for each team, every club Thursday
    #     that team did not list as playable (home or away).
    #   - Away availability is handled in match_count_limits: each team may play
    #     away only on the Thursdays it listed or inside the away windows it
    #     gave Colin, so a 'max_matches: 0' / 'venue_scope: away' / 'date_ranges' entry
    #     per team bars every other weekday (same idiom as Metropolitan and West
    #     London). Ranges are Mon-Fri spans with consecutive blocked weeks
    #     merged across the weekend between them, and run through June so the
    #     June away Thursdays Colin listed (KH1: 3/10/24 Jun; KH2: 3/24 Jun;
    #     KH3: 3/17/24 Jun) stay usable if the season overruns.
    #   - Colin flagged two Thursdays as "possibly" available for all three
    #     teams, then clarified on 2026-09-01: 2027-01-14 "could be OK for KH1,
    #     not for KH2 (unless nothing else works)". It is therefore taken as
    #     firm for KH1 only (home and away) and held unavailable for KH2 and
    #     KH3. 2027-03-25 (Maundy Thursday) is now in use for KH3 (freed from
    #     its unavailable_home_dates and away date_ranges): it is the extra
    #     KH3 Thursday the sixth Hendon team in division 3 needs (see the
    #     divisions note). It stays held unavailable for KH1 and KH2 -
    #     freeing it there removes no late date and does not widen the KH1/KH2
    #     gap (see the keep-apart note below).
    #   - "At a pinch" for KH2 (Colin, 2026-09-01): 2026-12-17 and 2027-04-22.
    #     2027-04-22 is now freed for KH2 (removed from its
    #     unavailable_home_dates and carved out of its away date_ranges) as the
    #     extra Thursday needed to switch on the no-consecutive-days KH1/KH2
    #     rule - see the keep-apart note below. 2026-12-17 stays held
    #     unavailable; it would have done the job equally well, and we may ask
    #     Colin whether he would rather use that one instead. Free 2026-12-17
    #     too if fixture congestion later requires it.
    #
    # The KH1 v KH2 derby: Colin asked for the two legs on 2026-10-08 and
    # 2026-12-10 ("nothing else works before Xmas, apart from 01 October if
    # necessary"). Both legs are pinned in fixed_fixtures below (KH1 home in
    # October, KH2 home in December - Colin gave no direction). The per-team
    # availability above would in fact force the same outcome on its own - the
    # only KH1 home date on which KH2 can also play away is 2026-10-01 or
    # 2026-10-08, the only KH2 home date on which KH1 can play away is
    # 2026-10-01 or 2026-12-10, and latest_internal_match_date (2026-12-31)
    # forces both legs before Xmas - but pinning removes the 1 Oct wobble and
    # keeps the dates fixed if other clubs' dates later shift.
    #
    # Colin also asked that the 1st and 2nd teams never play on the same day,
    # nor on consecutive days, and "preferably not in the same week". KH1 and
    # KH2 each play 14 division-2 matches out of barely 14 usable weeks, and
    # their available dates overlap heavily, so there is almost no slack:
    #   - Not the same day AND not consecutive days (time_window_days: 2) is now
    #     enforced (see match_count_limits below). It needs 2027-01-14 available
    #     to KH1 only (Colin's 2026-09-01 update) plus ONE more KH2 home
    #     Thursday; 2027-04-22 (offered "at a pinch" by Colin) is the one freed
    #     for it. 2026-12-17 would have worked equally well, as would 22 Oct, 5
    #     Nov, 28 Jan or 25 Feb. Same-day-only (time_window_days: 1) alone would
    #     solve without the extra date.
    #   - Not same week (time_window_days: 7) is still out of reach: it needs
    #     roughly five more KH2 home Thursdays across Oct-Nov, well beyond what
    #     is on the table. The KH2<->KH3 keep-apart (a full 7-day gap) is also
    #     enforced below and solves comfortably.
    #
    # Even with Colin's 2026-09-01 additions the spec still cannot fit all of
    # Kings Head's matches before the preferred 14th May finish: test solves
    # show the schedule still needs 2027-05-20 and 2027-05-27 (KH1 and KH2 home
    # to Hammersmith 2), plus Metropolitan's two June dates - all now inside the
    # Secretary's approved window (to 30th June). Freeing Maundy Thursday for
    # KH1, or KH2's other "at a pinch" Thursday (2026-12-17), does not change
    # that. The binding team is KH2: bringing Kings Head inside 14 May would
    # need roughly three more KH2 home Thursdays in the Oct-Nov stretch (e.g. 22
    # Oct + 5 Nov + one more). Metropolitan's June pair is driven by division
    # 2's own congestion and is independent of Kings Head - it cannot be removed
    # by giving Kings Head more dates.
    #
    # Colin's availability assumes the still-unconfirmed London League fixtures
    # "stay as is"; if they move, these lists move with them.
    #
    # Venue concurrent-match capacity: we assume the Mind Sports Centre can
