# Per Middlesex League Rule 7:
#   - divisions 1 and 2 have up to eight teams and play a Double Round
#     All-Play-All (scheme: double_round) - home and away against every
#     opponent;
#   - division 3, the last division, has eleven teams (more than eight), so
#     per Rule 7c it plays each pair once only (scheme: single_round), with
#     the home/away side of each match taken from the draw for the Berger
#     table.
#
# Hammersmith 3 sits in division 3 here (not division 2) because Colin
# Mackenzie agreed to Adam Cranston's request for Hammersmith 3 to decline
# promotion (email 2026-08-29). That leaves division 2 with eight teams.
# Division 3 has eleven teams (ten previously, plus a sixth Hendon team).
# The eleventh team gives Kings Head 3 a tenth match with no room for it in
# its Oct-May calendar, so 2027-03-25 (Maundy Thursday) - one of Colin's
# "possibly" dates - is freed for KH3 to make the season schedulable
# without moving Hendon's 2027-06-04 latest_match_date; see the
# club_constraints.kings-head and kings-head-3 notes.
#
# Every division's team list is in alphabetical (team ID) order; for
# divisions 1 and 2 that is cosmetic (a double round-robin is
# order-independent), but for division 3 it is also the Berger table draw -
# see the note there.
divisions:
  1:
    scheme: double_round
    teams:
      - albany-1
      - ealing-1
      - hackney-1
      - hammersmith-1
      - hendon-1
      - hendon-2
      - muswell-hill-1
      - west-london-1
  2:
    scheme: double_round
    teams:
      - hackney-2
      - hammersmith-2
      - harrow-1
      - hendon-3
      - kings-head-1
      - kings-head-2
      - metropolitan-1
      - willesden-brent-1
  3:
    scheme: single_round
    # For a single_round division this list's order IS the Berger table draw
    # (first team = table position 1, and so on), fixing the home/away side
    # of all 55 matches (C(11,2)). In lieu of a live draw the teams are in
    # alphabetical (team ID) order - an objective, reproducible ordering -
    # which we assume the League Secretary will accept for now.
    teams:
      - ealing-2
      - hackney-3
      - hammersmith-3
      - hammersmith-4
      - harrow-2
      - hendon-4
      - hendon-5
      - hendon-6
      - kings-head-3
      - muswell-hill-2
      - potters-bar-1

club_constraints:
  defaults:
    match_count_limits:
      # Spec-wide: each team plays at most one match in any 7-day window (a gap
      # of exactly 7 days is still allowed). A club replaces this with its own
      # 'override_key: weekly-gap' entry.
      - override_key: weekly-gap
        apply_per: each_team
        time_window_days: 7
        max_matches: 1
      # Spec-wide venue capacity: one home match a night. Clubs with a bigger
      # venue replace this via 'override_key: venue-capacity'.
      - override_key: venue-capacity
        venue_scope: home
        max_matches: 1
      # Christmas/New Year: no club schedules any fixture - home or away - in the
      # fortnight from Monday 2026-12-21 through Sunday 2027-01-03, on the
      # assumption nobody wants to play then. A whole-club max_matches: 0 date_ranges
      # default blocks it everywhere, so individual clubs don't repeat it in
      # their own unavailable_away_dates; a club could opt back in by overriding
      # 'no-play-dates'. (Home dates a club lists inside the range just go
      # unused; the weekend dates in the range never carry fixtures anyway.)
      - override_key: no-play-dates
        max_matches: 0
        date_ranges:
          - { start_date: "2026-12-21", end_date: "2027-01-03" }
  hendon:
    # Hendon league matches must conclude before the start of the Club Championship.
    latest_match_date: "2027-06-04"
    # Try to condense Hendon fixtures to as few match nights as possible.
    # This limit can be increased in order to make the spec feasible.
    home_dates_used:
      max: 14
    home_dates:
      - "2026-09-10"
      - "2026-09-17"
      - "2026-09-24"
      - "2026-10-08"
      - "2026-10-15"
      - "2026-10-22"
      - "2026-10-29"
      - "2026-11-12"
      - "2026-11-19"
      - "2026-11-26"
      - "2026-12-10"
      - "2027-01-14"
      - "2027-01-21"
      - "2027-01-28"
      - "2027-02-11"
      - "2027-02-18"
      - "2027-02-25"
      - "2027-03-11"
      - "2027-03-18"
      - "2027-03-25"
      - "2027-04-08"
      - "2027-04-15"
      - "2027-04-22"
      - "2027-04-29"
      - "2027-05-13"
    # Held in reserve in case of fixture congestion. Both fall after the
    # preferred 14th May season end (see top-of-file note - dates to 30th
    # June are allowed this season), so only use these if the season can't be
    # scheduled without them.
    # - '2027-05-20'
    # This date may be required for an Albany match
    # - '2027-05-27'
    match_count_limits:
      # Venue capacity: Hendon can host up to 3 team matches at once (replaces
      # the spec-wide one-a-night default).
      - override_key: venue-capacity
        venue_scope: home
        max_matches: 3
      # Hendon 1 and Hendon 2 (both division 1) draw on the same players, so keep
      # their matches at least a week apart (matches exactly 7 days apart are
      # still allowed).
      - teams: [hendon-1, hendon-2]
        time_window_days: 7
        max_matches: 1
      # London Chess Classic (24 Nov - 7 Dec 2026): no Hendon 1 or Hendon 2
      # match, home or away, during the Classic.
      - teams: [hendon-1, hendon-2]
        max_matches: 0
        date_ranges:
          - { start_date: "2026-11-24", end_date: "2026-12-07" }
      # Cap Hendon's overall load: no more than 3 teams playing in any
      # 7-consecutive-day period. 2026-09-10 is exempt: fixed_fixtures pins two
      # pre-season derbies there (Hendon 1 v 2 and Hendon 4 v 5 = 4 teams'-worth),
      # which that date's own max_matches_overrides entry (2) already covers.
      - time_window_days: 7
        max_playing_teams: 3
        exclude_dates:
          - "2026-09-10"
      # No more than 2 Hendon teams playing away on the same night (Andrew).
      # Whole-club (no 'teams'), a shared same-date budget (apply_per defaults
      # to across_teams, time_window_days to 1). venue_scope: away counts only
      # away fixtures, so any number of Hendon teams may still host at home
      # that night (the venue-capacity entry above governs that); and an
      # internal Hendon derby is not "away" for this cap (its away side plays
      # at Hendon's own venue), so the two pinned 2026-09-10 derbies don't
      # count against it.
      - venue_scope: away
        max_playing_teams: 2
      # No matches (even away matches) the week we have a seasonal break for Christmas
      - max_matches: 0
        date_ranges:
          - { start_date: "2026-12-14", end_date: "2026-12-20" }
      # Camden school-holiday weeks - Andrew wants Hendon's fixture load kept
      # down across these.
      - max_matches: 1
        date_ranges:
          - { start_date: "2026-10-26", end_date: "2026-11-01" } # Oct half term
          - { start_date: "2027-02-15", end_date: "2027-02-21" } # Feb half term
          - { start_date: "2027-03-22", end_date: "2027-03-28" } # Easter
          - { start_date: "2027-03-29", end_date: "2027-04-04" } # Easter
          - { start_date: "2027-04-05", end_date: "2027-04-11" } # Easter
          - { start_date: "2027-05-31", end_date: "2027-06-06" } # May half term
      # Per-date caps on Hendon's total matches (home + away) on a night, layered
      # on top of the 7-day cap above (max_matches: null = no cap except on the listed
      # dates):
      #
      #  - First Thursday of each month (= 1): the date of Hendon's monthly
      #    Blitz tournament. Hendon's home_dates deliberately skip these, so in
      #    practice this limits them to one away match that evening. Listed per
      #    date (the spec has no recurring-date concept) from the Blitz calendar
      #    Andrew supplied; the Jun/Jul/Aug 2027 entries are past the current
      #    season window and have no effect yet, but are recorded now so they
      #    apply automatically if dates that late are ever added to home_dates.
      #
      #  - September home dates (= 2): start-of-term is a busy period for the
      #    club (many members still renewing), so we keep the load down then.
      #    Add any further September dates here if the reserve ones are ever
      #    uncommented.
      - max_matches: null
        max_matches_overrides:
          "2026-09-03": 1
          "2026-09-10": 2
          "2026-09-17": 2
          "2026-09-24": 2
          "2026-10-01": 1
          "2026-11-05": 1
          "2026-12-03": 1
          "2027-01-07": 1
          "2027-02-04": 1
          "2027-03-04": 1
          "2027-04-01": 1
          "2027-05-06": 1
          "2027-06-03": 1
          "2027-07-01": 1
          "2027-08-05": 1
